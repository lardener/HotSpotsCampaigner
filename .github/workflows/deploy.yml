name: Deploy to OVH Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target namespace
        required: true
        default: battletech-campaigner
        type: choice
        options:
          - battletech-campaigner
          - battletech-campaigner-prod
          - staging
      dry_run:
        description: Preview manifests without applying
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Push & Apply Manifests
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'battletech-campaigner-prod' && 'production' || github.event.inputs.environment }}
    env:
      REGISTRY: vq9701ff.c1.va1.container-registry.ovh.us/library
      NAMESPACE: ${{ github.event.inputs.environment }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to OVH Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OVH_REGISTRY_USERNAME }}
          password: ${{ secrets.OVH_REGISTRY_PASSWORD }}

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/hotspotscampaigner-backend:${{ env.IMAGE_TAG }}

      - name: 'Build & push frontend image (K8s config: empty VITE_API_BASE_URL -> /api fallback)'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: ${{ env.REGISTRY }}/hotspotscampaigner-frontend:${{ env.IMAGE_TAG }}

      - name: Copy manifests to staging directory
        run: |
          mkdir -p staging
          cp ovhcloud-namespace.yaml staging/
          cp ovhcloud-backend-configmap.yaml staging/
          cp ovhcloud-frontend-configmap.yaml staging/
          cp ovhcloud-backend-deployment.yaml staging/
          cp ovhcloud-frontend-deployment.yaml staging/
          cp ovhcloud-backend-ingress.yaml staging/
          cp ovhcloud-frontend-ingress.yaml staging/

      - name: Install kubectl
        id: kubectl-install
        uses: azure/setup-kubectl@v5
        with:
          version: v1.32.0

      - name: Configure kubeconfig
        id: kubeconfig
        run: |
          mkdir -p ${{ runner.temp }}/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ${{ runner.temp }}/.kube/config
          chmod 600 ${{ runner.temp }}/.kube/config
          echo "kubeconfig=${{ runner.temp }}/.kube/config" >> $GITHUB_OUTPUT
        env:
          KUBECONFIG: ${{ runner.temp }}/.kube/config

      - name: Detect cluster version
        id: cluster-version
        run: |
          VERSION=$(kubectl version --kubeconfig="${{ steps.kubeconfig.outputs.kubeconfig }}" --short 2>/dev/null | grep -oP 'v\K[0-9]+\.[0-9]+' | head -1 || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Detected cluster version: $VERSION"

      - name: Update image tags in staged manifests
        run: |
          sed -i "s|image: ${REGISTRY}/hotspotscampaigner-backend:.*|image: ${REGISTRY}/hotspotscampaigner-backend:${IMAGE_TAG}|" staging/ovhcloud-backend-deployment.yaml
          sed -i "s|image: ${REGISTRY}/hotspotscampaigner-frontend:.*|image: ${REGISTRY}/hotspotscampaigner-frontend:${IMAGE_TAG}|" staging/ovhcloud-frontend-deployment.yaml

      - name: Dry run — preview diff
        if: inputs.dry_run == true
        run: |
          kubectl --kubeconfig="${{ steps.kubeconfig.outputs.kubeconfig }}" -n "$NAMESPACE" apply -f staging/ --dry-run=client -o yaml

      - name: Confirm production deployment
        if: inputs.environment == 'battletech-campaigner-prod' && inputs.dry_run != true
        run: |
          read -p "⚠️  WARNING: Deploying to PRODUCTION! Are you sure? (yes/no): " CONFIRM
          if [[ "$CONFIRM" != "yes" ]]; then
              echo "Deployment cancelled."
              exit 1
          fi

      - name: Apply Kubernetes manifests
        id: kubectl-apply
        run: |
          set -euo pipefail
          kubectl --kubeconfig="${{ steps.kubeconfig.outputs.kubeconfig }}" -n "$NAMESPACE" apply -f staging/
          kubectl --kubeconfig="${{ steps.kubeconfig.outputs.kubeconfig }}" -n "$NAMESPACE" rollout status deployment/backend-deployment --timeout=300s
          kubectl --kubeconfig="${{ steps.kubeconfig.outputs.kubeconfig }}" -n "$NAMESPACE" rollout status deployment/frontend-deployment --timeout=300s

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::warning::Deployment failed — rolling back..."
          kubectl --kubeconfig="${{ steps.kubeconfig.outputs.kubeconfig }}" -n "$NAMESPACE" rollout undo deployment/backend-deployment --timeout=120s || echo "Backend rollback failed or not needed"
          kubectl --kubeconfig="${{ steps.kubeconfig.outputs.kubeconfig }}" -n "$NAMESPACE" rollout undo deployment/frontend-deployment --timeout=120s || echo "Frontend rollback failed or not needed"
          echo "::warning::Rollout rollback complete. Please investigate and re-deploy."

      - name: Cleanup kubeconfig
        if: always()
        run: rm -rf ${{ runner.temp }}/.kube
