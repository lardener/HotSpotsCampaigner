spring:
  application:
    name: battletech-campaign-backend
  r2dbc:
    url: r2dbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:BT_Campaigner}${MYSQL_PARAMS:}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    pool:
      initial-size: 1
      max-size: 10
      max-idle-time: 30m
      max-life-time: 60m
      validation-query: SELECT 1
      max-create-connection-time: 5s
      max-acquire-time: 30s

  # Flyway is wired manually in FlywayConfig.java because DataSourceAutoConfiguration
  # backs off when an R2DBC ConnectionFactory is present, preventing the normal
  # FlywayAutoConfiguration from firing. The manual bean uses a short-lived HikariCP
  # DataSource built from the JDBC URL below (used only during startup migrations).
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:BT_Campaigner}${MYSQL_PARAMS:}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: ${AUTH0_CLIENT_ID:your-client-id-here}
            client-secret: ${AUTH0_CLIENT_SECRET:your-client-secret-here}
            scope:
              - openid
              - profile
              - email
            # Use the template to let Spring handle the base URL dynamically
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
        provider:
          auth0:
            # Issuer URI enables OIDC discovery of all endpoints from Auth0
            issuer-uri: https://${AUTH0_DOMAIN:your-tenant.us.auth0.com}/
            user-name-attribute: sub

server:
  port: 8080

logging:
  level:
    root: INFO
    com.hotspotscamp: INFO
