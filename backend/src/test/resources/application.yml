MYSQL_DATABASE: test
MYSQL_USER: test
MYSQL_PASSWORD: test
CORS_ALLOWED_ORIGINS: http://localhost

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
    pool:
      initial-size: 10
      max-size: 20
  sql:
    init:
      continue-on-error: true
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: test-client-id
            client-secret: test-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope:
              - openid
              - profile
              - email
        provider:
          auth0:
            issuer-uri: https://test-tenant.us.auth0.com/
            user-name-attribute: sub
